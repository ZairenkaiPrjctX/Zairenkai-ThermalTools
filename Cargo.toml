[workspace]
resolver = "2"
members = ["crates/zthermal-core", "crates/zthermal-platform", "crates/zthermal"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
